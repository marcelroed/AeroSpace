excluded:
  - .build
  - xcode
  - periphery
  - .claude # Claude Code agent worktrees (full repo copies with their own .build)

# https://realm.github.io/SwiftLint/rule-directory.html
only_rules:
  # - line_length # todo fix it
  - colon
  - computed_accessors_order
  - dynamic_inline # Avoid using ‘dynamic’ and ‘@inline(__always)’ together
  - empty_enum_arguments
  - empty_parameters # Prefer () -> over Void ->
  - empty_string # Prefer checking isEmpty over comparing string to an empty string literal
  - file_name_no_space
  - first_where
  - implicit_getter
  - is_disjoint
  - last_where # Prefer using .last(where:) over .filter { }.last in collections
  - legacy_constant
  - legacy_constructor # Swift constructors are preferred over legacy convenience functions
  - legacy_hashing # Prefer using the hash(into:) function instead of overriding hashValue
  - legacy_nsgeometry_functions # Struct extension properties and methods are preferred over legacy functions
  - legacy_random # Prefer using type.random(in:) over legacy functions
  - local_doc_comment # Prefer regular comments over doc comments in local scopes
  - no_fallthrough_only
  - no_space_in_method_call
  - nsobject_prefer_isequal # NSObject subclasses should implement isEqual instead of ==
  - function_name_whitespace
  - optional_enum_case_matching
  - redundant_discardable_let
  - redundant_nil_coalescing # nil coalescing operator is only evaluated if the lhs is nil, coalescing operator with nil as rhs is redundant
  - switch_case_alignment
  - toggle_bool
  - trailing_newline
  - trailing_semicolon # Lines should not have trailing semicolons
  - trailing_whitespace # Lines should not have trailing whitespace
  - unavailable_condition # Use #unavailable/#available instead of #available/#unavailable with an empty body.
  - unneeded_break_in_switch # Avoid using unneeded break statements
  - unneeded_override # Remove overridden functions that don’t do anything except call their super
  # - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated # When the index or the item is not used, .enumerated() can be removed.
  - unused_setter_value
  - weak_delegate # Delegates should be weak to avoid reference cycles
  - custom_rules

switch_case_alignment:
  indented_cases: true

custom_rules:
  # The tests run the commands, the callbacks and the sessions against FakePlatform. An effect on the user's session
  # elsewhere runs for real in every test that reaches it (move-mouse posted a mouse event from every test run). Platform
  # is the way to macOS; ui/ is AeroSpace's own windows and menu, whose models the tests use; the other excluded files
  # run only at the app's start. Anything else: guard it with checkIsAeroSpaceApp and disable the rule on its line
  live_effect:
    name: "Live effect outside Platform"
    included: 'Sources/AppBundle/'
    excluded: 'Sources/AppBundle/(platform/|ui/|initAppBundle\.swift|GlobalObserver\.swift|server\.swift|util/appBundleUtil\.swift)'
    regex: '\bCGEvent\b|CGWarpMouseCursorPosition|\bProcess\(\)|NSAppleScript|NSWorkspace\.shared|\bNSSound\b|NSBeep|\bSound\.output\b|NSPasteboard|SMAppService|AXUIElementCreate(SystemWide|Application)|\bHotKey\(|addGlobalMonitorForEvents|UserDefaults\.standard\.(set|removeObject)|orderFront|\bNSApp\.|NSApplication\.shared'
    excluded_match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field, string]
    message: "A live effect runs in the tests too: go through Platform (FakePlatform logs it), or guard it with checkIsAeroSpaceApp"
    severity: error

strict: true
# quiet: true
